name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: node-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release gate / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    defaults:
      run:
        working-directory: trendhub-mcp

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: trendhub-mcp/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Deterministic tests
        run: npm test

      - name: MCP smoke handshake
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(node -e "const fs=require('fs');const p='professional-manifest.json';process.stdout.write(String(fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')).expectedToolCount:19))")"
          npm run smoke | tee /tmp/trendhub-smoke.txt
          grep -F "SMOKE OK tools=${EXPECTED}" /tmp/trendhub-smoke.txt

      - name: Remote MCP and public web security smoke
        shell: bash
        env:
          TRENHUB_REMOTE_HOST: 127.0.0.1
          PORT: "18444"
        run: |
          set -euo pipefail
          EXPECTED="$(node -e "const fs=require('fs');const p='professional-manifest.json';process.stdout.write(String(fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')).expectedToolCount:19))")"
          VERSION="$(node -p "require('./package.json').version")"
          npm run start:remote >/tmp/trendhub-remote.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18444/health >/tmp/trendhub-health.json 2>/dev/null; then
              break
            fi
            sleep 0.25
          done
          node -e "const h=require('/tmp/trendhub-health.json'); const expected=Number(process.argv[1]); const version=process.argv[2]; if(!h.ok || h.tools!==expected || h.version!==version || !h.web) process.exit(1)" "$EXPECTED" "$VERSION"
          EXPECTED_PLATFORMS="$(node --input-type=module -e "import { listPlatforms } from './dist/src/sources/index.js'; process.stdout.write(String(listPlatforms().length))")"
          TRENTHUB_EXPECTED_PLATFORMS="$EXPECTED_PLATFORMS" npm run smoke:remote -- http://127.0.0.1:18444/mcp | tee /tmp/trendhub-remote-smoke.txt
          grep -F "REMOTE SMOKE OK tools=${EXPECTED} platforms=${EXPECTED_PLATFORMS}" /tmp/trendhub-remote-smoke.txt
          curl -fsS http://127.0.0.1:18444/ >/tmp/trendhub-web.html
          grep -F 'name="viewport"' /tmp/trendhub-web.html
          grep -F 'TrendHub' /tmp/trendhub-web.html
          curl -fsS http://127.0.0.1:18444/api/platforms >/tmp/trendhub-platforms.json
          node -e "const p=require('/tmp/trendhub-platforms.json'); const expected=Number(process.argv[1]); if(!Array.isArray(p.platforms) || p.platforms.length!==expected) process.exit(1)" "$EXPECTED_PLATFORMS"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18444/api/snapshot)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18444/api/workspaces)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18444/api/observability)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18444/api/snapshot)" = "405"

  bootstrap-e2e:
    name: Bootstrap E2E / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Force verified portable Node 24 bootstrap (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: trendhub-mcp
        env:
          TRENHUB_BOOTSTRAP_FORCE_PORTABLE: "1"
          TRENTHUB_INSTALL_CHANNEL: dev
        run: |
          set -euo pipefail
          EXPECTED="$(node -e "const fs=require('fs');const p='professional-manifest.json';process.stdout.write(String(fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')).expectedToolCount:19))" 2>/dev/null || echo 21)"
          bash scripts/bootstrap.sh --global | tee "$RUNNER_TEMP/trendhub-bootstrap.txt"
          grep -F "AI_BOOTSTRAP_OK " "$RUNNER_TEMP/trendhub-bootstrap.txt"
          grep -F "SMOKE OK tools=${EXPECTED}" "$RUNNER_TEMP/trendhub-bootstrap.txt"

      - name: Force verified portable Node 24 bootstrap (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: trendhub-mcp
        env:
          TRENHUB_BOOTSTRAP_FORCE_PORTABLE: "1"
          TRENTHUB_INSTALL_CHANNEL: dev
        run: |
          $manifest = Get-Content .\professional-manifest.json -Raw | ConvertFrom-Json
          $expected = [string]$manifest.expectedToolCount
          $output = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\bootstrap.ps1 2>&1
          $status = $LASTEXITCODE
          $output | Tee-Object -FilePath "$env:RUNNER_TEMP\trendhub-bootstrap.txt"
          if ($status -ne 0) { exit $status }
          if (-not ($output | Select-String -SimpleMatch "AI_BOOTSTRAP_OK ")) { throw "missing AI_BOOTSTRAP_OK marker" }
          if (-not ($output | Select-String -SimpleMatch "SMOKE OK tools=$expected")) { throw "missing $expected-tool smoke marker" }


  visual-preview:
    name: Visual preview / desktop + mobile
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/v1.7.4-user-product-clean'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: trendhub-mcp
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: trendhub-mcp/package-lock.json

      - name: Install and build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Start preview server
        env:
          TRENHUB_AUTOUPDATE: "0"
          TRENHUB_REMOTE_HOST: 127.0.0.1
          PORT: "18445"
        run: |
          npm run start:remote >"$RUNNER_TEMP/trendhub-preview.log" 2>&1 &
          for i in $(seq 1 80); do
            curl -fsS http://127.0.0.1:18445/health >/dev/null 2>&1 && exit 0
            sleep 0.5
          done
          cat "$RUNNER_TEMP/trendhub-preview.log"
          exit 1

      - name: Install CJK fonts for visual review
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Assert rendered DOM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trendhub-debug"
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=2500 --dump-dom "http://127.0.0.1:18445/#/dashboard" > "$RUNNER_TEMP/trendhub-debug/home-dom.html" 2>"$RUNNER_TEMP/trendhub-debug/home-chrome.log" || true
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=2500 --dump-dom "http://127.0.0.1:18445/#/research" > "$RUNNER_TEMP/trendhub-debug/research-dom.html" 2>"$RUNNER_TEMP/trendhub-debug/research-chrome.log" || true
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=2500 --dump-dom "http://127.0.0.1:18445/#/discover" > "$RUNNER_TEMP/trendhub-debug/discover-dom.html" 2>"$RUNNER_TEMP/trendhub-debug/discover-chrome.log" || true
          cp "$RUNNER_TEMP/trendhub-preview.log" "$RUNNER_TEMP/trendhub-debug/server.log" || true
          node - <<'NODE'
          const fs = require('fs');
          const checks = [
            ['home', process.env.RUNNER_TEMP + '/trendhub-debug/home-dom.html', 'class="home-search"'],
            ['research', process.env.RUNNER_TEMP + '/trendhub-debug/research-dom.html', 'id="rvEntryForm"'],
            ['discover', process.env.RUNNER_TEMP + '/trendhub-debug/discover-dom.html', 'class="discover-page"'],
          ];
          let failed = false;
          for (const [name, file, needle] of checks) {
            const html = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : '';
            const ok = html.includes(needle);
            console.log(`DOM_ASSERT ${name}=${ok ? 'OK' : 'FAIL'} bytes=${html.length} needle=${needle}`);
            if (!ok) {
              failed = true;
              console.log(`DOM_HEAD_${name.toUpperCase()}\n${html.slice(0, 2400)}`);
            }
          }
          if (failed) process.exit(1);
          NODE

      - name: Capture real product surfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trendhub-visual"
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2500 --window-size=1440,1200 --screenshot="$RUNNER_TEMP/trendhub-visual/home-desktop.png" "http://127.0.0.1:18445/#/dashboard"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2500 --window-size=390,844 --screenshot="$RUNNER_TEMP/trendhub-visual/home-mobile.png" "http://127.0.0.1:18445/#/dashboard"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2500 --window-size=1440,1200 --screenshot="$RUNNER_TEMP/trendhub-visual/research-desktop.png" "http://127.0.0.1:18445/#/research"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2500 --window-size=390,844 --screenshot="$RUNNER_TEMP/trendhub-visual/research-mobile.png" "http://127.0.0.1:18445/#/research"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2500 --window-size=1440,1200 --screenshot="$RUNNER_TEMP/trendhub-visual/discover-desktop.png" "http://127.0.0.1:18445/#/discover"

      - name: Upload visual preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trendhub-v174-visual-preview
          path: |
            ${{ runner.temp }}/trendhub-visual/*.png
            ${{ runner.temp }}/trendhub-debug/*
          if-no-files-found: warn
