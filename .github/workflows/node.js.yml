name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: node-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release gate / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    defaults:
      run:
        working-directory: trendhub-mcp

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: trendhub-mcp/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Deterministic tests
        run: npm test

      - name: MCP smoke handshake
        run: |
          npm run smoke | tee /tmp/trendhub-smoke.txt
          grep -F "SMOKE OK tools=19" /tmp/trendhub-smoke.txt

      - name: Remote MCP and public web security smoke
        shell: bash
        env:
          TRENHUB_REMOTE_HOST: 127.0.0.1
          PORT: "18444"
        run: |
          set -euo pipefail
          npm run start:remote >/tmp/trendhub-remote.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18444/health >/tmp/trendhub-health.json 2>/dev/null; then
              break
            fi
            sleep 0.25
          done
          node -e "const h=require('/tmp/trendhub-health.json'); if(!h.ok || h.tools!==19 || h.version!=='1.4.2' || !h.web) process.exit(1)"
          npm run smoke:remote -- http://127.0.0.1:18444/mcp | tee /tmp/trendhub-remote-smoke.txt
          grep -F "REMOTE SMOKE OK tools=19 platforms=38" /tmp/trendhub-remote-smoke.txt
          curl -fsS http://127.0.0.1:18444/ >/tmp/trendhub-web.html
          grep -F 'name="viewport"' /tmp/trendhub-web.html
          grep -F 'TrendHub' /tmp/trendhub-web.html
          curl -fsS http://127.0.0.1:18444/api/platforms >/tmp/trendhub-platforms.json
          node -e "const p=require('/tmp/trendhub-platforms.json'); if(!Array.isArray(p.platforms) || p.platforms.length!==38) process.exit(1)"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18444/api/snapshot)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18444/api/snapshot)" = "405"

  bootstrap-e2e:
    name: Bootstrap E2E / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Force verified portable Node 24 bootstrap (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: trendhub-mcp
        env:
          TRENTHUB_BOOTSTRAP_FORCE_PORTABLE: "1"
          TRENTHUB_INSTALL_CHANNEL: dev
        run: |
          set -euo pipefail
          bash scripts/bootstrap.sh --global | tee "$RUNNER_TEMP/trendhub-bootstrap.txt"
          grep -F "AI_BOOTSTRAP_OK " "$RUNNER_TEMP/trendhub-bootstrap.txt"
          grep -F "SMOKE OK tools=19" "$RUNNER_TEMP/trendhub-bootstrap.txt"

      - name: Force verified portable Node 24 bootstrap (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: trendhub-mcp
        env:
          TRENTHUB_BOOTSTRAP_FORCE_PORTABLE: "1"
          TRENTHUB_INSTALL_CHANNEL: dev
        run: |
          $output = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\bootstrap.ps1 2>&1
          $status = $LASTEXITCODE
          $output | Tee-Object -FilePath "$env:RUNNER_TEMP\trendhub-bootstrap.txt"
          if ($status -ne 0) { exit $status }
          if (-not ($output | Select-String -SimpleMatch "AI_BOOTSTRAP_OK ")) { throw "missing AI_BOOTSTRAP_OK marker" }
          if (-not ($output | Select-String -SimpleMatch "SMOKE OK tools=19")) { throw "missing 19-tool smoke marker" }
