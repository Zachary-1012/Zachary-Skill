name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: node-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release gate / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    defaults:
      run:
        working-directory: trendhub-mcp

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: trendhub-mcp/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Deterministic tests
        run: npm test

      - name: MCP smoke handshake
        run: npm run smoke
