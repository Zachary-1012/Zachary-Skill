name: Public Install E2E

on:
  workflow_call:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-install:
    runs-on: ubuntu-latest

    steps:
      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v5
        with:
          node-version: 24.x

      - name: Fresh clone from the public repository URL
        shell: bash
        run: |
          rm -rf /tmp/zachary-skill-public
          git clone --depth 1 https://github.com/Zachary-1012/Zachary-Skill.git /tmp/zachary-skill-public
          test -f /tmp/zachary-skill-public/trendhub-mcp/SKILL.md
          test -f /tmp/zachary-skill-public/trendhub-mcp/manifest.json
          test -f /tmp/zachary-skill-public/trendhub-mcp/scripts/bootstrap.sh
          test -f /tmp/zachary-skill-public/trendhub-mcp/docs/intelligence-methodology.md

      - name: Run the documented Node-free AI installation contract
        working-directory: /tmp/zachary-skill-public/trendhub-mcp
        shell: bash
        env:
          TRENHUB_BOOTSTRAP_FORCE_PORTABLE: "1"
        run: |
          set -euo pipefail
          EXPECTED="$(node -e "const fs=require('fs');const p='professional-manifest.json';const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));process.stdout.write(String(fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')).expectedToolCount:m.tools.length))")"
          bash scripts/bootstrap.sh --global | tee /tmp/trendhub-bootstrap.txt
          grep -F "AI_BOOTSTRAP_OK " /tmp/trendhub-bootstrap.txt
          grep -F "SMOKE OK tools=${EXPECTED}" /tmp/trendhub-bootstrap.txt

      - name: Verify stable pin and MCP readiness
        working-directory: /tmp/zachary-skill-public/trendhub-mcp
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          EXPECTED="$(node -e "const fs=require('fs');const p='professional-manifest.json';const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));process.stdout.write(String(fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')).expectedToolCount:m.tools.length))")"
          TAG="$(git describe --tags --exact-match HEAD)"
          test "$TAG" = "v$VERSION"
          npm run smoke | tee /tmp/trendhub-smoke.txt
          grep -F "SMOKE OK tools=${EXPECTED}" /tmp/trendhub-smoke.txt
          node -e "const m=require('./manifest.json');const v=process.argv[1];const expected=Number(process.argv[2]);if(m.version!==v || m.aiInstall?.successMarker!==('SMOKE OK tools='+expected) || m.tools?.length!==expected) process.exit(1)" "$VERSION" "$EXPECTED"

      - name: Public install contract result
        if: success()
        run: echo "PUBLIC INSTALL E2E OK — public repo -> verified portable Node 24 bootstrap -> stable release -> npm ci/build -> dynamic MCP tool contract"
