name: Cleanup Stale Branches Once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cleanup-stale-branches-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Delete only verified stale branches
        shell: bash
        run: |
          set -euo pipefail

          branches=(
            "feat/professional-trend-intelligence-v14"
            "fix/bootstrap-candidate-gate-v14"
            "fix/bootstrap-channel-env-v14"
            "hardening/public-install-e2e"
            "hardening/public-stable-v1"
            "ops/production-mcp-protocol-smoke"
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              echo "Deleting verified stale branch: ${branch}"
              git push origin --delete "${branch}"
            else
              echo "Already absent: ${branch}"
            fi
          done

          mapfile -t remaining < <(
            git ls-remote --heads origin \
              | awk '{sub("refs/heads/", "", $2); print $2}' \
              | sort
          )

          printf 'Remaining remote branches:\n'
          printf '  %s\n' "${remaining[@]}"

          unexpected=0
          for branch in "${remaining[@]}"; do
            case "${branch}" in
              main|ops/cleanup-stale-branches-once)
                ;;
              *)
                echo "UNEXPECTED branch remains: ${branch}" >&2
                unexpected=1
                ;;
            esac
          done

          if [[ "${unexpected}" -ne 0 ]]; then
            exit 20
          fi

          echo "STALE BRANCH CLEANUP OK"
