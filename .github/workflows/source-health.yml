name: Source Health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  source-health:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trendhub-mcp

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: trendhub-mcp/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Check live third-party sources
        run: npm run source:health

      - name: Upload quantified health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-health-${{ github.run_id }}
          path: trendhub-mcp/data/health/source-health-latest.json
          if-no-files-found: warn
          retention-days: 30

      - name: Explain scope
        if: always()
        run: |
          echo "Source Health observes third-party availability, latency and data quality."
          echo "It is intentionally separate from PR CI and the Stable Release gate."
          echo "The JSON artifact is evidence for reliability review; it does not contain user telemetry."
