name: Production Remote MCP

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trendhub-production-remote-mcp
  cancel-in-progress: true

jobs:
  production-remote-contract:
    name: Production Remote MCP contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: trendhub-mcp

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: trendhub-mcp/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify public production MCP contract
        env:
          TRENTHUB_EXPECTED_TOOLS: "21"
          TRENTHUB_EXPECTED_PLATFORMS: "51"
        run: |
          npm run smoke:remote -- https://trendhub-remote-production.up.railway.app/mcp | tee /tmp/trendhub-production-remote.txt
          grep -F "REMOTE SMOKE OK tools=21 platforms=51" /tmp/trendhub-production-remote.txt

      - name: Explain scope
        if: always()
        run: |
          echo "This job validates the currently released public Railway endpoint, not the unmerged development branch."
          echo "Stable production remains 21 tools / 51 runtime sources until a later explicit release is approved."
          echo "It performs no write tool calls, no deployment, sends no cookies, and stores no user telemetry."
