name: Publish MCP Registry

on:
  # Railway Wait for CI watches every workflow attached to a commit. Starting
  # Registry publication before Railway finishes creates a cycle: Railway waits
  # for this workflow while this workflow waits for Railway. Publish only after
  # Railway reports a successful production deployment instead.
  deployment_status:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'production')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: trendhub-mcp/package-lock.json

      - name: Verify registry metadata matches canonical version
        shell: bash
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./trendhub-mcp/package.json').version")"
          SERVER_VERSION="$(jq -r '.version' server.json)"
          MANIFEST_VERSION="$(jq -r '.version' trendhub-mcp/manifest.json)"
          EXPECTED_TOOLS="$(node -e "const fs=require('fs');const p='trendhub-mcp/professional-manifest.json';const m=JSON.parse(fs.readFileSync('trendhub-mcp/manifest.json','utf8'));process.stdout.write(String(fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')).expectedToolCount:m.tools.length))")"
          test "$PKG_VERSION" = "$SERVER_VERSION"
          test "$PKG_VERSION" = "$MANIFEST_VERSION"
          test "$(jq '.tools | length' trendhub-mcp/manifest.json)" = "$EXPECTED_TOOLS"
          test "$(jq -r '.name' server.json)" = "io.github.Zachary-1012/trendhub"
          test "$(jq -r '.remotes[0].type' server.json)" = "streamable-http"
          test "$(jq -r '.remotes[0].url' server.json)" = "https://trendhub-remote-production.up.railway.app/mcp"
          echo "Registry candidate version: $PKG_VERSION tools=$EXPECTED_TOOLS"

      - name: Install locked runtime dependencies
        working-directory: trendhub-mcp
        run: npm ci --no-audit --no-fund

      - name: Wait for matching public Remote MCP deployment
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./trendhub-mcp/package.json').version")"
          EXPECTED_TOOLS="$(node -e "const fs=require('fs');const p='trendhub-mcp/professional-manifest.json';const m=JSON.parse(fs.readFileSync('trendhub-mcp/manifest.json','utf8'));process.stdout.write(String(fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')).expectedToolCount:m.tools.length))")"
          HEALTH="https://trendhub-remote-production.up.railway.app/health"
          for i in $(seq 1 60); do
            if BODY="$(curl -fsS --max-time 10 "$HEALTH" 2>/dev/null)"; then
              REMOTE_VERSION="$(printf '%s' "$BODY" | jq -r '.version // empty')"
              TOOLS="$(printf '%s' "$BODY" | jq -r '.tools // 0')"
              if [ "$REMOTE_VERSION" = "$VERSION" ] && [ "$TOOLS" = "$EXPECTED_TOOLS" ]; then
                echo "Remote MCP ready: v$REMOTE_VERSION tools=$TOOLS"
                exit 0
              fi
              echo "Remote reachable but not current yet: version=$REMOTE_VERSION tools=$TOOLS expected=$EXPECTED_TOOLS"
            else
              echo "Remote not ready yet (attempt $i/60)"
            fi
            sleep 10
          done
          echo "Remote MCP did not reach canonical version/tool contract within 10 minutes" >&2
          exit 1

      - name: Real MCP handshake against public endpoint
        working-directory: trendhub-mcp
        env:
          TRENHUB_EXPECT_AGENT_FOUNDATION: "1"
        run: npm run smoke:remote -- https://trendhub-remote-production.up.railway.app/mcp

      - name: Install official mcp-publisher
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help >/dev/null

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish verified TrendHub server metadata
        shell: bash
        run: |
          set +e
          OUTPUT="$(./mcp-publisher publish 2>&1)"
          STATUS=$?
          set -e
          printf '%s\n' "$OUTPUT"
          if [ "$STATUS" -eq 0 ]; then
            exit 0
          fi
          if printf '%s' "$OUTPUT" | grep -Fq "cannot publish duplicate version"; then
            echo "Registry version is already published; treating this no-op release as success."
            exit 0
          fi
          exit "$STATUS"
