<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eee8dc">
  <meta name="robots" content="noindex,nofollow">
  <title>TrendHub · 内容工作台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23212724'/%3E%3Cpath d='M7 21l5-6 4 4 5-8 4 5' fill='none' stroke='%23f4f3ef' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=2.0.2">
  <link rel="stylesheet" href="responsive-v2.css?v=2.0.2">
  <link rel="stylesheet" href="experience-v2.css?v=2.0.2">
</head>
<body class="experience-v2">
  <div class="nav-backdrop" id="navBackdrop" hidden></div>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/studio" aria-label="TrendHub 内容工作台">
        <span class="brand-logo">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16l4-5 3 3 4-6 5 6"/></svg>
        </span>
        <span class="brand-name">TrendHub</span>
      </a>

      <button class="sidebar-new" id="sidebarNewResearch" type="button">＋ 新建创作</button>

      <nav class="nav primary-nav" aria-label="主导航">
        <span class="nav-group-label">创作</span>
        <a class="nav-item" data-view="studio" href="#/studio">内容工作台</a>
        <a class="nav-item" data-view="library" href="#/library">内容资产</a>
        <a class="nav-item" data-view="calendar" href="#/calendar">发布计划</a>
        <span class="nav-group-label">趋势</span>
        <a class="nav-item" data-view="research" href="#/research">趋势研究</a>
        <a class="nav-item" data-view="discover" href="#/discover">灵感发现</a>
        <a class="nav-item" data-view="watch" href="#/watch">持续关注</a>
      </nav>

      <div class="sidebar-recents">
        <div class="sidebar-section-title">最近创作</div>
        <div id="sidebarRecents"></div>
      </div>

      <div class="sidebar-bottom">
        <a class="nav-item" data-view="settings" href="#/settings">设置</a>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-inner">
          <button class="nav-toggle" id="navToggle" aria-label="打开菜单" aria-controls="navigationSheet" aria-expanded="false">
            <span></span><span></span><span></span>
          </button>
          <h1 class="topbar-title" id="viewTitle">内容工作台</h1>
          <div class="top-spacer"></div>
          <button class="top-action" id="newResearchTop" type="button">新建创作</button>
        </div>
      </header>

      <main class="content">
        <div id="content"></div>
        <footer class="foot">
          <span id="runtimeMode"></span>
          <span class="dot">·</span>
          <span>缺失数据会明确标注，不会被当作“没有”。</span>
        </footer>
      </main>
    </div>
  </div>

  <nav class="navigation-sheet" id="navigationSheet" aria-label="移动导航" hidden>
    <div class="sheet-head">
      <strong>TrendHub</strong>
      <button class="sheet-close" id="closeNavigation" aria-label="关闭菜单">×</button>
    </div>
    <div class="sheet-scroll">
      <button class="sheet-new" id="sheetNewResearch" type="button">＋ 新建创作</button>
      <a class="nav-item" data-view="studio" href="#/studio">内容工作台</a>
      <a class="nav-item" data-view="library" href="#/library">内容资产</a>
      <a class="nav-item" data-view="calendar" href="#/calendar">发布计划</a>
      <a class="nav-item" data-view="research" href="#/research">趋势研究</a>
      <a class="nav-item" data-view="discover" href="#/discover">灵感发现</a>
      <a class="nav-item" data-view="watch" href="#/watch">持续关注</a>
      <div class="sheet-rule"></div>
      <a class="nav-item" data-view="settings" href="#/settings">设置</a>
    </div>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="auth.js?v=2.0.2"></script>
  <script src="agent-context.js?v=2.0.2"></script>
  <script src="app.js?v=2.0.2"></script>
  <script src="views-a.js?v=2.0.2"></script>
  <script src="views-b.js?v=2.0.2"></script>
  <script src="views-c.js?v=2.0.2"></script>
  <script src="views-d.js?v=2.0.2"></script>
  <script src="views-e.js?v=2.0.2"></script>
  <script src="views-f.js?v=2.0.2"></script>
  <script src="content-studio.js?v=2.0.2"></script>
</body>
</html>
