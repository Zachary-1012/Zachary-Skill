<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrendHub 热点趋势控制台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2310a37f'/%3E%3Cpath d='M4 16l4.5-5 3.5 3 5-6.5L20 10' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 16l4.5-5 3.5 3 5-6.5L20 10" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div>
          <div class="brand-name">TrendHub</div>
          <div class="brand-sub">全网热点趋势控制台</div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <div class="nav-group">总览</div>
        <div class="nav-item" data-view="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          概览
        </div>
        <div class="nav-group">当下热点</div>
        <div class="nav-item" data-view="xhs">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2.5c1.2 3.2-2 4.6-2 7.4a2.6 2.6 0 0 0 5.2 0c0-1-.4-1.9-.9-2.5.9.5 2.2 1.9 2.2 4.4a5.7 5.7 0 1 1-11.4 0C5.1 5.4 9 4 12 2.5z"/></svg>
          小红书热点<span class="nav-tag">主打</span>
        </div>
        <div class="nav-item" data-view="trending">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l5-5 4 3 7-8" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 7h4v4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          当下热榜
        </div>
        <div class="nav-item" data-view="overlap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="10" r="5.5"/><circle cx="15.5" cy="14.5" r="5.5"/></svg>
          跨平台共振
        </div>
        <div class="nav-item" data-view="clusters">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="7" r="2.4"/><circle cx="18" cy="7" r="2.4"/><circle cx="12" cy="17" r="2.4"/><path d="M8 8.5l2.5 6M16 8.5l-2.5 6M8.2 7h7.6"/></svg>
          共振话题发现
        </div>
        <div class="nav-item" data-view="changes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v16m0 0l-5-5m5 5l5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          新晋 / 掉榜
        </div>
        <div class="nav-group">趋势与未来</div>
        <div class="nav-item" data-view="curve">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4v16h18" stroke-linecap="round"/><path d="M6 15l4-5 3 2 5-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          关键词趋势曲线
        </div>
        <div class="nav-item" data-view="related">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5" stroke-linecap="round"/></svg>
          相关搜索词
        </div>
        <div class="nav-item" data-view="signals">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1" stroke-linecap="round"/><circle cx="12" cy="12" r="3"/></svg>
          未来信号
        </div>
        <div class="nav-item" data-view="events">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4" stroke-linecap="round"/></svg>
          节点日历
        </div>
        <div class="nav-group">分析与生产</div>
        <div class="nav-item" data-view="topic">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h11l3 3v13H5z" stroke-linejoin="round"/><path d="M9 9h6M9 13h6M9 17h4" stroke-linecap="round"/></svg>
          话题深度情报
        </div>
        <div class="nav-item" data-view="brief">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 3h8l4 4v14H7z" stroke-linejoin="round"/><path d="M10 11h6M10 15h6M10 7h3" stroke-linecap="round"/></svg>
          创作简报
        </div>
        <div class="nav-item" data-view="templates">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5" stroke-linecap="round"/></svg>
          模板库
        </div>
        <div class="nav-group">系统</div>
        <div class="nav-item" data-view="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2-1.2L14.2 3h-4l-.4 2.7a7 7 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2 1.2l.4 2.7h4l.4-2.7a7 7 0 0 0 2-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z" stroke-linejoin="round"/></svg>
          设置与说明
        </div>
      </nav>
      <div class="sidebar-foot">
        <div><span class="dot"></span>本地运行 · 仅 127.0.0.1</div>
        <div style="margin-top:6px;">零模型 Key · 零遥测 · 零数据回传</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="viewTitle">概览</h1>
        <div class="crumb" id="crumb">数据实时来自各平台公开接口，缺失会显式标记，不做估算填充</div>
      </header>
      <section class="content" id="content">
        <div class="spinner"></div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <script src="app.js" defer></script>
</body>
</html>
